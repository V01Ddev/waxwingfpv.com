# The lead project. First full pipeline run.
#
# Note: the site never labels work as "client work" — it labels it by the kind
# of business. That stays true whether or not money changed hands, and it
# avoids claiming a commercial relationship you would have to defend.
title:
  tr: 'The Nish Coffee'
  en: 'The Nish Coffee'
clientType: 'cafe'
clientName: 'The Nish Coffee'
location:
  tr: 'Küçükçekmece, İstanbul'
  en: 'Küçükçekmece, Istanbul'
date: '2026-10-10'
order: 1
featured: true

goal:
  tr: 'Yeni açılan bir kafenin içini, müşterinin kapıdan girdiği gibi göstermek: mekân, tezgâh ve ışık, tek kesintisiz hareketle.'
  en: 'Show a new coffee shop the way a customer sees it walking in: the room, the counter and the light, in one continuous move.'

result:
  tr: 'Mekânın içinden tek çekimde geçiş. Renk düzenlemesi yapıldı, 16:9 film ve 9:16 reel olarak teslim edildi.'
  en: 'One unbroken pass through the room, graded and delivered as a 16:9 film and a 9:16 reel.'

description:
  tr: 'Sürecin baştan sona ilk kez eksiksiz işlediği proje: keşif, uçuş planı, mekân içinde tek kesintisiz geçiş, kurgu ve iki formatta teslim. Meteor75 Pro II ile çekildi.'
  en: 'The first complete run of the pipeline, end to end: recce, flight plan, a single continuous pass through the room, edit, and delivery in both formats. Shot on the Meteor75 Pro II.'

gear:
  airframe: 'meteor75-pro-ii'
  camera: 'DJI O4 Wide'

