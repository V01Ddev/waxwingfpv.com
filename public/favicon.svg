<!--
  Favicon: the mark itself, in the site's own colours — silk wings, brand-grey
  glint and tip, on a plumage tile.

  Chosen over the glint alone, which was measured at 16/32/64px and reads as an
  X in every one of them, i.e. a close button. The full mark reads as a bird.
  The tile is opaque so it holds up on both light and dark browser themes.
  Content sits inside the 80% maskable safe zone.
-->
